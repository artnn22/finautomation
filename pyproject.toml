[project]
name = "finautomation"
version = "0.3.0"
description = "ОПЕКС: пакетный финансовый анализ эмитентов"
readme = "README.md"
authors = [
    { name = "artnn", email = "acloudycloudy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.2.3",
    "matplotlib<=3.11.2",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.13.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
finautomation = "finautomation.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"
